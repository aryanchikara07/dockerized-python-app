name: Docker CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            aryanchikara/dockerized-python-app:latest
            aryanchikara/dockerized-python-app:${{ github.sha }}

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -

          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              "$EC2_USERNAME@$EC2_HOST" << 'EOF'

            sudo docker pull aryanchikara/dockerized-python-app:latest

            sudo docker rm -f dockerized-python-app || true

            sudo docker run -d \
              --name dockerized-python-app \
              --restart unless-stopped \
              -p 80:5000 \
              aryanchikara/dockerized-python-app:latest

            sudo docker ps
          EOF